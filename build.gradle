plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base.archivesName = 'exposure-aperture'

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	modImplementation "maven.modrinth:exposure:${exposure_version}"
	modImplementation "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}"
	modImplementation "maven.modrinth:iris:${iris_version}"
	modRuntimeOnly "maven.modrinth:sodium:${sodium_version}"

	// runClient only: libraries Forge Config API Port and Iris ship nested in their jars, which Modrinth's maven doesn't list
	runtimeOnly 'com.electronwill.night-config:core:3.8.0'
	runtimeOnly 'com.electronwill.night-config:toml:3.8.0'
	runtimeOnly 'org.antlr:antlr4-runtime:4.13.1'
	runtimeOnly 'io.github.douira:glsl-transformer:3.0.0-pre3'
	runtimeOnly 'org.anarres:jcpp:1.4.14'
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

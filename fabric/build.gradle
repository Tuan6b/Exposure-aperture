plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base.archivesName = 'exposure-aperture-fabric'

// The shared code lives in ../common and is compiled here against the Fabric jars of Exposure and Iris.
sourceSets.main {
	java.srcDir '../common/src/main/java'
	resources.srcDir '../common/src/main/resources'
}

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	modImplementation "maven.modrinth:exposure:${exposure_version}"
	modImplementation "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}"
	modImplementation "maven.modrinth:iris:${iris_version}"
	modRuntimeOnly "maven.modrinth:sodium:${sodium_version}"

	// runClient only: libraries Forge Config API Port and Iris ship nested in their jars, which Modrinth's maven doesn't list
	runtimeOnly 'com.electronwill.night-config:core:3.8.0'
	runtimeOnly 'com.electronwill.night-config:toml:3.8.0'
	runtimeOnly 'org.antlr:antlr4-runtime:4.13.1'
	runtimeOnly 'io.github.douira:glsl-transformer:3.0.0-pre3'
	runtimeOnly 'org.anarres:jcpp:1.4.14'
}

// `gradlew prodClient`: a clean production 1.21.1 instance in run/prod with the real (intermediary) jars of this mod
// and its stack. Anything extra dropped in run/prod/mods loads too; the edited pack goes in run/prod/shaderpacks.
configurations { prodMods { transitive = false } }

dependencies {
	prodMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	prodMods "maven.modrinth:exposure:${exposure_version}"
	prodMods "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}"
	prodMods "maven.modrinth:iris:${iris_version}"
	prodMods "maven.modrinth:sodium:${sodium_version}"
}

tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(configurations.prodMods, remapJar)
	runDir = file('run/prod')
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from(rootProject.file('LICENSE')) { rename { "${it}_exposure_aperture" } }
}
